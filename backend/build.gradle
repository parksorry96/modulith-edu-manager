plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	// MapStruct를 위한 annotation processor 플러그인
//	id 'org.mapstruct.ap' version '0.2.0'
}

group = 'com.edumanager'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', "1.4.1")
	set('mapstructVersion', "1.6.3")
	set('springdocVersion', "2.7.0")
	set('testcontainersVersion', "1.20.4")
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// MongoDB - 이벤트 스토리지용
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	
	// Kafka & Modulith
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.modulith:spring-modulith-events-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	// implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
	// MongoDB Modulith - 이벤트 퍼시스턴스용
	implementation 'org.springframework.modulith:spring-modulith-starter-mongodb'
	// Modulith Actuator & Observability
//	implementation 'org.springframework.modulith:spring-modulith-starter-actuator'
//	implementation 'org.springframework.modulith:spring-modulith-starter-observability'
	runtimeOnly 'org.springframework.modulith:spring-modulith-events-kafka'
	
	// OpenAPI 3 Documentation
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	
	// MapStruct for mapping
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	
	// Email
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	
	// Cache for OTP
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	
	// Monitoring & Metrics
	// implementation 'io.micrometer:micrometer-registry-prometheus'
	
	// Database
	runtimeOnly 'org.postgresql:postgresql'
	
	// Utility Libraries
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Development
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.1.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
